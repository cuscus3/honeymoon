  var KEY = 'rt_pc_v1';
  var f = document.getElementById('f'),
      pw = document.getElementById('pw'),
      go = document.getElementById('go'),
      msg = document.getElementById('msg');

  function b64(s) {
    var raw = atob(s), n = raw.length, out = new Uint8Array(n);
    for (var i = 0; i < n; i++) out[i] = raw.charCodeAt(i);
    return out;
  }
  function hex(buf) {
    return Array.prototype.map.call(new Uint8Array(buf), function (b) {
      return ('0' + b.toString(16)).slice(-2);
    }).join('');
  }

  function unlock(pass, remember) {
    msg.className = 'msg working';
    msg.textContent = 'Unlocking…';
    go.disabled = true;
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: b64(DATA.salt), iterations: DATA.iter, hash: 'SHA-256' },
          base, { name: 'AES-CBC', length: 256 }, false, ['decrypt']);
      })
      .then(function (key) {
        return crypto.subtle.decrypt({ name: 'AES-CBC', iv: b64(DATA.iv) }, key, b64(DATA.ct));
      })
      .then(function (plain) {
        return crypto.subtle.digest('SHA-256', plain).then(function (d) {
          if (hex(d) !== DATA.sha256) throw new Error('bad');
          return new TextDecoder('utf-8').decode(plain);
        });
      })
      .then(function (html) {
        if (remember) { try { localStorage.setItem(KEY, pass); } catch (e) {} }
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function () {
        try { localStorage.removeItem(KEY); } catch (e) {}
        go.disabled = false;
        msg.className = 'msg';
        msg.textContent = 'That passcode didn’t work.';
        pw.value = '';
        pw.focus();
      });
  }

  function submit(e) {
    if (e) e.preventDefault();
    if (pw.value && !go.disabled) unlock(pw.value, true);
  }
  f.addEventListener('submit', submit);
  go.addEventListener('click', submit);
  pw.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.keyCode === 13) submit(e);
  });

  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) unlock(saved, false);
})();
